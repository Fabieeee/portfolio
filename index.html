<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portfolio – Mon parcours</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF1F7;--surface:#fff;--ink:#3D1F3B;--muted:#855F7D;--line:#F6CFE2;--hl:#FFE27A;
  --accent:#E0409A;--on-accent:#fff;--signal:#A97BFF;
  --display:"Poppins","Segoe UI",Arial,sans-serif;--body:"Poppins","Segoe UI",Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#25121F;--surface:#351B2E;--ink:#FFE9F4;--muted:#DDAAC8;--line:#5C2F51;--hl:#8A6A00;--accent:#FF7EC0;--on-accent:#2A1024;--signal:#C9A8FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#25121F;--surface:#351B2E;--ink:#FFE9F4;--muted:#DDAAC8;--line:#5C2F51;--hl:#8A6A00;--accent:#FF7EC0;--on-accent:#2A1024;--signal:#C9A8FF;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg) radial-gradient(60vmax 40vmax at 90% -10%,color-mix(in srgb,var(--accent) 22%,transparent),transparent) fixed;color:var(--ink);font:400 1rem/1.75 var(--body);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.page{max-width:1100px;margin:0 auto;padding:clamp(18px,4vw,48px)}
header{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:clamp(28px,6vw,64px)}
.brand{all:unset;cursor:pointer;font:700 1.5rem var(--display);color:var(--accent);display:flex;align-items:center;gap:12px}
.brand:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.hint{color:var(--muted);font-size:.92rem}
.todo{background:color-mix(in srgb,var(--hl) 70%,transparent);padding:0 5px;border-radius:6px}
/* ACCUEIL */
.hello{font:700 clamp(2.4rem,7vw,4.8rem)/1 var(--display);letter-spacing:-.035em;margin:0 0 16px;max-width:16ch}
.sub{color:var(--muted);max-width:50ch;margin:0 0 clamp(32px,6vw,64px)}
.folders{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px}
.folder{all:unset;cursor:pointer;display:block;position:relative;margin-top:22px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px 28px 28px 28px;padding:28px 24px 24px;transition:transform .25s,border-color .25s}
.folder::before{content:attr(data-label);position:absolute;left:-1.5px;top:-23px;height:23px;padding:0 16px;display:flex;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;font-size:.82rem;color:var(--muted);transition:background .25s,color .25s,border-color .25s}
.folder:hover,.folder:focus-visible{transform:translateY(-6px);border-color:var(--accent)}
.folder:hover::before,.folder:focus-visible::before{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.folder h2{font:700 1.9rem/1.1 var(--display);letter-spacing:-.02em;margin:0 0 8px}
.folder p{margin:0 0 18px;color:var(--muted)}
.folder .open{font-weight:500;color:var(--accent)}
/* PROJET */
.proj{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(20px,4vw,56px)}
.explorer{display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:20px}
.explorer button{all:unset;cursor:pointer;padding:10px 14px;border-radius:8px;border:1.5px solid transparent;color:var(--muted);font-weight:500}
.explorer button:hover{background:var(--surface)}
.explorer button[aria-current="true"]{background:var(--surface);border-color:var(--line);color:var(--ink)}
.explorer button:focus-visible{outline:3px solid var(--accent)}
.back{margin-bottom:14px;color:var(--accent)!important}
.proj h2{font:700 clamp(2.2rem,5vw,3.6rem)/1 var(--display);letter-spacing:-.03em;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin:26px 0 24px;border-bottom:1.5px solid var(--line)}
.tabs button{all:unset;cursor:pointer;padding:10px 16px;margin-bottom:-1.5px;border-bottom:3px solid transparent;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:focus-visible{outline:3px solid var(--accent)}
.bar{height:6px;background:var(--line);border-radius:3px;margin-bottom:20px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--signal));transition:width .35s}
.stepper{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:24px}
.steps{display:flex;flex-direction:column;gap:6px}
.steps button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:var(--muted);font-weight:500}
.steps button::before{content:"";width:12px;height:12px;border-radius:50%;border:3px solid var(--accent);flex:none}
.steps button.low::before{border-color:var(--signal)}
.steps button[aria-selected="true"]{background:var(--surface);color:var(--ink)}
.steps button[aria-selected="true"]::before{background:var(--accent)}
.steps button.low[aria-selected="true"]::before{background:var(--signal)}
.steps button:focus-visible{outline:3px solid var(--accent)}
.detail{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:24px;min-height:200px}
.detail h3{font:700 1.5rem/1.2 var(--display);margin:0 0 10px}
.detail p{margin:0;max-width:56ch}
.fade{animation:in .3s}
@keyframes in{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.links{margin-top:24px}.links a{display:inline-block;text-decoration:none;color:var(--accent);margin:0 8px 8px 0}.nav2{display:flex;justify-content:space-between;margin-top:18px}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 18px;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:10px;padding:0;margin:0;list-style:none}
.chips li{background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:6px 16px}
.learn{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.learn li{background:var(--surface);border:1.5px solid var(--line);border-left:4px solid var(--accent);border-radius:18px;padding:14px 20px}
.next{margin-top:36px;color:var(--muted)}
.next button{all:unset;cursor:pointer;color:var(--accent);font-weight:500}

.sparkles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.sparkles span{position:absolute;bottom:-40px;color:var(--accent);opacity:0;animation:rise linear infinite}
.page{position:relative;z-index:1}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}12%{opacity:.5}100%{transform:translateY(-115vh) rotate(300deg);opacity:0}}
.folder{animation:pop .6s backwards cubic-bezier(.34,1.56,.64,1)}
.folder:nth-child(2){animation-delay:.12s}.folder:nth-child(3){animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:translateY(34px) scale(.85)}}
.ico{display:inline-block;font-size:2.3rem;margin-bottom:4px}
.folder:hover .ico,.folder:focus-visible .ico{animation:wiggle .7s}
@keyframes wiggle{20%{transform:rotate(-14deg) scale(1.2)}50%{transform:rotate(12deg) scale(1.2)}80%{transform:rotate(-6deg)}}
.wave{display:inline-block;transform-origin:70% 70%;animation:wave 2s 1s 2}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%,50%{transform:rotate(16deg)}20%,40%{transform:rotate(-10deg)}}
.steps button[aria-selected="true"]::before{animation:ring 1.8s infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 10px transparent}}
.btn,.explorer button,.tabs button,.steps button{transition:transform .15s,background .2s,color .2s}
.btn:active:not(:disabled){transform:scale(.92)}
.proj section{animation:in .4s}
.heart{position:fixed;z-index:50;pointer-events:none;color:var(--accent);animation:burst .8s forwards}
@keyframes burst{from{opacity:1;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.3)}}

.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:center 25%;border:2px solid var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,290px);gap:clamp(24px,5vw,64px);align-items:center;margin-bottom:clamp(36px,6vw,64px)}
.hero .sub{margin-bottom:0}
.portrait{position:relative;isolation:isolate;justify-self:center;width:100%;max-width:290px;animation:bob 6s ease-in-out infinite}
.portrait::before{content:"";position:absolute;inset:16px -16px -16px 16px;border-radius:999px 999px 30px 30px;background:linear-gradient(160deg,var(--accent),var(--signal));opacity:.5;z-index:-1}
.portrait img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 20%;border-radius:999px 999px 30px 30px;border:5px solid var(--surface)}
@keyframes bob{50%{transform:translateY(-10px)}}
.ico svg{width:1em;height:1em;color:var(--accent);display:block}
.hico svg{width:.7em;height:.7em;vertical-align:-.04em;color:var(--accent);margin-right:12px;display:inline-block}
.contact{margin-top:clamp(48px,8vw,96px);padding:clamp(22px,4vw,40px);background:var(--surface);border:1.5px solid var(--line);border-radius:28px}
.contact h2{font:700 1.6rem var(--display);margin:0 0 6px}
.contact p{margin:0 0 18px;color:var(--muted)}
.clist{display:flex;flex-wrap:wrap;gap:10px}
.clist a{text-decoration:none;color:var(--accent);word-break:break-all}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cp{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 14px;font-size:.85rem;color:var(--muted)}
.cp:hover{border-color:var(--accent);color:var(--accent)}
.tabs{overflow-x:auto}.tabs button{white-space:nowrap}
.files{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.files li{display:flex;align-items:center;gap:14px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:12px 16px}
.files li>div{flex:1;min-width:0}.files strong{display:block;overflow-wrap:anywhere}.files small{color:var(--muted)}
.kind{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent);font-weight:600;font-size:.78rem}
.files .btn{text-decoration:none;color:var(--accent)}
.empty{border:1.5px dashed var(--line);border-radius:22px;padding:28px;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--ink);font:700 1.2rem var(--display)}.empty p{margin:0;max-width:52ch}
@media (max-width:820px){
  .hero{grid-template-columns:1fr}.portrait{order:-1;max-width:200px}
  .proj{grid-template-columns:1fr}
  .explorer{flex-direction:row;flex-wrap:wrap;position:static}
  .stepper{grid-template-columns:1fr}
  .steps{flex-direction:row;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
body{background:var(--bg)}
.sparkles,.heart{display:none}
.folder{animation:none}.folder:hover .ico,.folder:focus-visible .ico{animation:none}
.portrait{animation:none}.portrait::before{background:var(--accent);opacity:.18}
.steps button[aria-selected="true"]::before{animation:none}
.hello{font-size:clamp(2.1rem,5.4vw,3.6rem);max-width:none;line-height:1.1;margin:0 0 18px}
.lead{font-size:1.15rem;max-width:46ch;color:var(--muted);margin:0 0 26px}
.cta{display:flex;flex-wrap:wrap;gap:12px}.cta .btn{padding:10px 24px}
.btn.solid{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
header{flex-wrap:wrap}
.top{display:flex;gap:4px;flex-wrap:wrap}
.top button{all:unset;cursor:pointer;padding:6px 14px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.top button:hover,.top button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.top button:focus-visible{outline:3px solid var(--accent)}
.pt{font:700 clamp(2rem,4.5vw,3rem)/1.1 var(--display);margin:0 0 24px}
.sec{font:700 1.4rem var(--display);margin:48px 0 16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:clamp(24px,5vw,56px);align-items:start}
.prose p{margin:0 0 16px;max-width:60ch}
.facts{margin:0;padding:0 0 0 18px;border-left:3px solid var(--accent);list-style:none;display:grid;gap:14px}
.facts b{display:block;font-weight:500;color:var(--muted);font-size:.88rem}
.skills{display:grid;gap:18px}.skills h3{margin:0 0 8px;font:600 1rem var(--display)}
.tl{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
.tl li{padding:0 0 22px 22px;position:relative}
.tl li::before{content:"";position:absolute;left:-6px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.tl button{all:unset;cursor:pointer;font-weight:600}.tl button:hover{color:var(--accent)}.tl button:focus-visible{outline:3px solid var(--accent)}
.tl small{display:block;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(24px,5vw,56px)}
.field{display:grid;gap:6px;margin-bottom:14px}.field label{font-weight:500}
.field input,.field textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;width:100%}
.field textarea{min-height:140px;resize:vertical}
.foot{margin-top:72px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
.clist{flex-direction:column;align-items:flex-start}
.files li.pvli{display:block;padding:0;border:0;background:none}
.pvli iframe{display:block;width:100%;height:70vh;border:1.5px solid var(--line);border-radius:14px;background:#fff}
.files .pv{color:var(--ink)}
@media (max-width:820px){.two,.cgrid{grid-template-columns:1fr}}
.brand span{display:block;line-height:1.15}
.brand small{display:block;font:500 .78rem var(--body);color:var(--muted);margin-top:4px}
.hero{margin-bottom:36px}.sec.first{margin-top:0}
.portrait.small{max-width:220px}
.links.head{margin:18px 0 0}.links.head .btn:first-child{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px)}
.hero2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(220px,360px);gap:clamp(28px,6vw,80px);align-items:center;margin-top:clamp(8px,3vw,36px)}
.eyebrow{font:500 .82rem var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin:0 0 16px}
.mega{font:700 clamp(3.2rem,10vw,6.6rem)/.95 var(--display);letter-spacing:-.04em;margin:0 0 22px}
.mega span{display:block;font-size:.46em;letter-spacing:-.02em;color:var(--muted);margin-top:12px;overflow-wrap:anywhere}
.typing{font:500 1.2rem var(--body);min-height:1.8em;margin:0 0 28px}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);margin-left:3px;vertical-align:-.18em;animation:blink 1s steps(2) infinite}
@keyframes blink{to{opacity:0}}
.htext>*{animation:up .8s backwards}.htext>:nth-child(2){animation-delay:.1s}.htext>:nth-child(3){animation-delay:.2s}.htext>:nth-child(4){animation-delay:.3s}
@keyframes up{from{opacity:0;transform:translateY(26px)}}
.rv{opacity:0}.rv.in{opacity:1;animation:up .7s backwards}
.pframe{position:relative;justify-self:center;width:100%;max-width:340px;animation:up .9s .2s backwards}
.pframe::before{content:"";position:absolute;inset:-4% -9% 7% 13%;background:var(--accent);border-radius:999px 999px 36px 36px;transform:rotate(6deg);z-index:1}
.pframe img{display:block;position:relative;z-index:2;width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center 20%;border-radius:999px 999px 36px 36px;border:6px solid var(--surface)}
.orb{position:absolute;z-index:3;border-radius:50%}
.o1{width:86px;height:86px;border:2px dashed var(--ink);left:-36px;bottom:12%;animation:spin 20s linear infinite}
.o2{width:22px;height:22px;background:var(--signal);right:-6px;top:10%}
@keyframes spin{to{transform:rotate(360deg)}}
.sticker{position:absolute;z-index:4;background:var(--surface);border:1.5px solid var(--ink);padding:6px 14px;border-radius:999px;font:600 .85rem var(--display);animation:floaty 5s ease-in-out infinite}
.st1{left:-28px;top:24%;rotate:-6deg}.st2{right:-20px;bottom:22%;rotate:5deg;animation-delay:-2.5s}
@keyframes floaty{50%{translate:0 -10px}}
.note{position:absolute;z-index:4;font:700 1.7rem "Caveat",cursive;color:var(--accent);right:0;top:-38px;rotate:6deg}
.marquee{overflow:hidden;margin:56px calc(-1*clamp(18px,4vw,48px));border-block:1.5px solid var(--ink);padding:14px 0;rotate:-1.4deg;background:var(--surface)}
.track{display:flex;gap:34px;width:max-content;animation:slide 30s linear infinite;font:600 1.15rem var(--display)}
.track span{white-space:nowrap}.track i{color:var(--accent);font-style:normal}
@keyframes slide{to{transform:translateX(-50%)}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px;margin:56px 0}
.stat b{display:block;font:700 clamp(2.4rem,5vw,3.6rem)/1 var(--display);color:var(--accent)}
.stat span{display:block;margin-top:6px;color:var(--muted);font-size:.92rem;max-width:20ch}
.folders{counter-reset:f}
.folder{--tint:var(--accent);counter-increment:f;background:color-mix(in srgb,var(--tint) 11%,var(--surface))}
.folder:nth-child(2){--tint:var(--signal)}.folder:nth-child(3){--tint:#FF9A76}
.folder::after{content:"0" counter(f);position:absolute;right:20px;top:12px;font:700 2.8rem/1 var(--display);color:color-mix(in srgb,var(--tint) 40%,transparent)}
.folder .ico svg{color:var(--tint)}
.folder:hover,.folder:focus-visible{border-color:var(--tint)}
.folder:hover::before,.folder:focus-visible::before{background:var(--tint);border-color:var(--tint)}
.folder .open{color:var(--ink)}.folder .open::after{content:" →";display:inline-block;transition:translate .25s}.folder:hover .open::after{translate:6px 0}
@media (max-width:820px){.hero2{grid-template-columns:1fr}.pframe{max-width:270px;margin-top:20px}.st1{left:-8px}.st2{right:-8px}.o1{left:-12px}}
</style>
</head>
<body>
<div class="page">
  <header><button class="brand" id="home" data-go=""><img class="avatar" id="av" alt=""><span>Annah Razafindramiandra<small>BTS SIO option SLAM · MCCI Business School</small></span></button><nav class="top" aria-label="Sections"><button data-go="apropos">À propos</button><button data-go="projets">Projets</button><button data-go="contact">Contact</button></nav></header>
  <div id="app"></div>
  <footer class="foot">© 2026 Annah Razafindramiandra · BTS SIO option SLAM · MCCI Business School</footer>

{id:"cinetrack",ico:IC.film,files:[],name:"CineTrack",label:"Application de bureau",tag:"Application de gestion pour le cinéma Le Lumière : programmation, billetterie et statistiques.",meta:"RP2 · en équipe avec Mia, Finou et Joon",
 tags:["Java","JavaFX / FXML","CSS","Maven","IntelliJ IDEA","PostgreSQL","pgAdmin","JUnit 5","Git / GitHub","BCrypt"],links:[{l:"Présentation",u:"https://canva.link/5elw110ymf0qs17"}],
 steps:[
  {t:"Le contexte",d:"Le cinéma Le Lumière, un complexe de plusieurs salles à Maurice, utilisait un premier logiciel de gestion en Java/Swing. Dans ce scénario inspiré d’une situation réelle, nous jouions le rôle de DevCore, société de services informatiques chargée de le moderniser : CineTrack 2.0, une application de bureau pour les caissiers et l’administrateur. Projet réalisé avec Mia, Finou et Joon."},
  {t:"Ce que l’application devait faire",d:"Gérer le catalogue de films, les salles et la programmation des séances, avec détection automatique des conflits d’horaire. Gérer la billetterie : réservation, annulation et billet à numéro unique, avec tarifs appliqués selon la catégorie (plein, réduit, étudiant, abonnement). Ajouter des statistiques (films les plus réservés, taux d’occupation, chiffre d’affaires) exportables en PDF ou CSV, et des avis clients avec note moyenne."},
  {t:"Les choix techniques",d:"Interface JavaFX avec des vues FXML et une feuille de style CSS, code organisé selon le patron MVC, projet Maven sous IntelliJ IDEA, exceptions métier dédiées et base PostgreSQL avec au moins une procédure stockée et un trigger. Livraison sous forme d’un exécutable Windows (.exe)."},
  {t:"Sécurité et qualité",d:"Le cahier des charges exigeait des mots de passe hachés avec BCrypt, des requêtes préparées contre les injections SQL, le blocage d’un compte après plusieurs échecs de connexion, la validation de toutes les saisies, des tests unitaires JUnit 5 sur les règles sensibles, un journal des actions sensibles en base et une politique de sauvegarde."},
  {t:"Mon rôle dans l’équipe",d:T("Ta part du travail : écrans, base de données, tests, sécurité, gestion de projet… et comment vous vous êtes réparti les tâches.")},
  {t:"Moment difficile",d:T("Un bug ou un blocage que tu as résolu, et comment."),low:1},
  {t:"Résultat",d:T("Ce que l’application fait aujourd’hui, lien GitHub, captures d’écran.")}],

  {t:"Conception",d:"J’ai réalisé le MCD sous Looping, traduit en base relationnelle en 3FN : 14 tables et des règles de gestion claires. Hoby a fait les maquettes PowerPoint. L’architecture est en trois couches : présentation, logique PHP et données MySQL."},
  {t:"Développement",d:"Espace public : accueil dynamique, catalogue avec filtres combinés, fiche détaillée avec carnet d’entretien. Espace client : réservation d’un essai et suivi de son statut. Administration : tableau de bord « À traiter », gestion du parc, validation des essais, messagerie et journal d’audit."},
